services:
  postgres:
    image: postgres:16
    container_name: nosql_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB:-nasa_analytics}
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DB:-nasa_analytics}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: nosql_mongo
    restart: unless-stopped
    profiles:
      - mongo
    # Raise the $group memory limit from the 100 MB default to 1 GB: Q2's first stage
    # builds ~2.1M (resource_path, host) groups, which otherwise spill to disk.
    # Full data: Q2 26.7 s -> 13.5 s (see pipelines/mongodb/README.md).
    command: ["mongod", "--setParameter", "internalDocumentSourceGroupMaxMemoryBytes=1073741824"]
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==============================================================================
  # Hadoop + Hive (profile "hadoop"), used by the Hive pipeline
  #   docker compose --profile hadoop up -d
  # Five containers: HDFS (namenode + datanode), a PostgreSQL metastore database, the
  # Hive metastore service and HiveServer2 (Thrift, port 10000). All use the
  # big-data-europe images (Hadoop 2.7.4 + Hive 2.3.2, one consistent version set).
  # Memory: about 4-5 GB. Stop the "mongo" profile while running Hive on a small laptop.
  # ==============================================================================
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop2.7.4-java8
    container_name: nosql_namenode
    restart: unless-stopped
    profiles: ["hadoop"]
    env_file: ./docker/hadoop-hive.env
    environment:
      CLUSTER_NAME: nasa-etl
    volumes:
      - namenode_data:/hadoop/dfs/name
    ports:
      - "${HDFS_UI_PORT:-50070}:50070"

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop2.7.4-java8
    container_name: nosql_datanode
    restart: unless-stopped
    profiles: ["hadoop"]
    env_file: ./docker/hadoop-hive.env
    environment:
      SERVICE_PRECONDITION: "namenode:50070"
    volumes:
      - datanode_data:/hadoop/dfs/data
    depends_on:
      - namenode

  hive-metastore-postgresql:
    image: bde2020/hive-metastore-postgresql:2.3.0
    container_name: nosql_hive_metastore_db
    restart: unless-stopped
    profiles: ["hadoop"]
    volumes:
      - hive_metastore_data:/var/lib/postgresql/data

  hive-metastore:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: nosql_hive_metastore
    restart: unless-stopped
    profiles: ["hadoop"]
    env_file: ./docker/hadoop-hive.env
    command: /opt/hive/bin/hive --service metastore
    environment:
      SERVICE_PRECONDITION: "namenode:50070 datanode:50075 hive-metastore-postgresql:5432"
    depends_on:
      - namenode
      - datanode
      - hive-metastore-postgresql

  hive-server:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: nosql_hive_server
    restart: unless-stopped
    profiles: ["hadoop"]
    env_file: ./docker/hadoop-hive.env
    environment:
      SERVICE_PRECONDITION: "hive-metastore:9083"
    ports:
      - "${HIVE_PORT:-10000}:10000"
    volumes:
      # The Hive engine writes each batch to a text file here, then HiveQL
      # "LOAD DATA LOCAL INPATH '/staging/...'" copies it into HDFS.
      - ${HIVE_STAGING_DIR:-./.hive_staging}:/staging
    depends_on:
      - hive-metastore
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/10000'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  postgres_data:
  mongo_data:
  namenode_data:
  datanode_data:
  hive_metastore_data:
