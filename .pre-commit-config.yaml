repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=1000']
      # spec/ fixtures are byte-exact test data (test.log has a deliberate
      # trailing-whitespace line), so the auto-fixers must not touch them.
      - id: trailing-whitespace
        exclude: ^spec/
      - id: end-of-file-fixer
        exclude: ^spec/
      - id: check-yaml
      - id: check-toml
      - id: check-json

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
